# Paired variance estimate for the backbone comparison.
#
# configs/seeds.yaml repeats the SAM 2 headline config at seeds 1-3. These are the
# frozen ConvNeXt and scratch U-Net baselines at the same seeds, so every seed has
# all three backbones trained on the SAME split (data.seed also draws the
# temporal_block split) and the backbone gap can be read as a paired difference.
# Seed 42 for all three is in runs/decisive.

- name: convnext_seed_1
  data: {seed: 1}
  model: {name: convnext_frozen}
- name: convnext_seed_2
  data: {seed: 2}
  model: {name: convnext_frozen}
- name: convnext_seed_3
  data: {seed: 3}
  model: {name: convnext_frozen}

- name: unet_seed_1
  data: {seed: 1}
  model: {name: unet}
- name: unet_seed_2
  data: {seed: 2}
  model: {name: unet}
- name: unet_seed_3
  data: {seed: 3}
  model: {name: unet}
